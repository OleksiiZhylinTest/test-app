# ──────────────────────────────────────────────────────────────────────────────
# Bump Version — AI Adoption Metrics Report
# ──────────────────────────────────────────────────────────────────────────────
#
# Manually triggered: Actions → "Bump Version" → Run workflow
#
# Bump types:
#   major  1.2.3 → 2.0.0   (breaking change — resets minor and patch)
#   minor  1.2.3 → 1.3.0   (new feature — resets patch)
#   patch  1.2.3 → 1.2.4   (bug fix / hotfix)
#
# For hotfixes: set branch to hotfix/v1.2.4 and bump_type to patch.
#
# Because develop is a protected branch (requires PR + status checks), this
# workflow pushes the change to a temporary branch and opens a PR automatically.
# Merge the PR once CI passes — no manual file edits needed.
# ──────────────────────────────────────────────────────────────────────────────

name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options: [major, minor, patch]
        default: minor
      branch:
        description: "Target branch (default: develop)"
        required: false
        default: develop

permissions:
  contents: write
  pull-requests: write

jobs:

  bump:
    name: Bump ${{ inputs.bump_type }} on ${{ inputs.branch || 'develop' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || 'develop' }}
          token: ${{ secrets.GH_PAT }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version in pyproject.toml
        id: bump
        run: |
          CURRENT=$(grep -Po '(?<=^version = ")[^"]+' pyproject.toml)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump_type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW="${MAJOR}.${MINOR}.${PATCH}"
          sed -i "s/^version = \"${CURRENT}\"/version = \"${NEW}\"/" pyproject.toml
          echo "old=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          PR_BRANCH="chore/bump-version-${NEW}"
          echo "pr_branch=${PR_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Push to temporary branch
        run: |
          git checkout -b ${{ steps.bump.outputs.pr_branch }}
          git add pyproject.toml
          git commit -m "chore: bump version ${{ steps.bump.outputs.old }} → ${{ steps.bump.outputs.new }} [${{ inputs.bump_type }}]"
          git push origin ${{ steps.bump.outputs.pr_branch }}

      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "chore: bump version ${{ steps.bump.outputs.old }} → ${{ steps.bump.outputs.new }} [${{ inputs.bump_type }}]",
              head: "${{ steps.bump.outputs.pr_branch }}",
              base: "${{ inputs.branch || 'develop' }}",
              body: "Automated version bump triggered by `Bump Version` workflow.\n\n| | Version |\n|---|---|\n| Before | `${{ steps.bump.outputs.old }}` |\n| After | `${{ steps.bump.outputs.new }}` |\n| Type | ${{ inputs.bump_type }} |"
            });
            core.summary.addRaw(`### Version Bump PR created\n\n[${pr.title}](${pr.html_url})\n\nMerge it once CI passes to complete the version bump.`);
            await core.summary.write();

      - name: Write summary
        run: |
          echo "### Version Bump" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Before | \`${{ steps.bump.outputs.old }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| After  | \`${{ steps.bump.outputs.new }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Type   | ${{ inputs.bump_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ inputs.branch || 'develop' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PR branch | \`${{ steps.bump.outputs.pr_branch }}\` |" >> $GITHUB_STEP_SUMMARY
