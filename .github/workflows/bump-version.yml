# ──────────────────────────────────────────────────────────────────────────────
# Bump Version — AI Adoption Metrics Report
# ──────────────────────────────────────────────────────────────────────────────
#
# Manually triggered: Actions → "Bump Version" → Run workflow
#
# Bump types:
#   major  1.2.3 → 2.0.0   (breaking change — resets minor and patch)
#   minor  1.2.3 → 1.3.0   (new feature — resets patch)
#   patch  1.2.3 → 1.2.4   (bug fix / hotfix)
#
# This workflow creates a dedicated release/vX.Y.Z branch (cut from the source
# branch, default: develop), bumps the version in pyproject.toml, and opens a
# PR directly to master. CI validates the release branch like any other branch.
# When the PR is merged to master (merge commit — not rebase), the release.yml
# pipeline fires automatically to build, tag, and publish the GitHub Release,
# then syncs the version bump back to develop via a merge commit.
#
# For hotfixes: set source branch to master and bump_type to patch.
# ──────────────────────────────────────────────────────────────────────────────

name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options: [major, minor, patch]
        default: minor
      branch:
        description: "Source branch to cut the release from (default: develop; use master for hotfixes)"
        required: false
        default: develop

permissions:
  contents: write
  pull-requests: write

jobs:

  bump:
    name: Cut release/v${{ inputs.bump_type }} from ${{ inputs.branch || 'develop' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || 'develop' }}
          token: ${{ secrets.GH_PAT }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version in pyproject.toml
        id: bump
        run: |
          CURRENT=$(grep -Po '(?<=^version = ")[^"]+' pyproject.toml)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump_type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW="${MAJOR}.${MINOR}.${PATCH}"
          TODAY=$(date -u +%Y-%m-%d)
          sed -i "s/^version = \"${CURRENT}\"/version = \"${NEW}\"/" pyproject.toml
          sed -i "s/v${CURRENT}/v${NEW}/g" \
            docs/product/features/confluence_kb.html \
            docs/product/features/confluence_kb_standalone.html
          sed -i "s/Released: [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}/Released: ${TODAY}/" \
            docs/product/features/confluence_kb.html \
            docs/product/features/confluence_kb_standalone.html
          echo "old=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          PR_BRANCH="release/v${NEW}"
          echo "pr_branch=${PR_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Push release branch
        run: |
          git checkout -b ${{ steps.bump.outputs.pr_branch }}
          git add pyproject.toml \
                  docs/product/features/confluence_kb.html \
                  docs/product/features/confluence_kb_standalone.html
          git commit -m "chore: bump version ${{ steps.bump.outputs.old }} → ${{ steps.bump.outputs.new }} [${{ inputs.bump_type }}]"
          git push origin ${{ steps.bump.outputs.pr_branch }}

      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "release: v${{ steps.bump.outputs.new }}",
              head: "${{ steps.bump.outputs.pr_branch }}",
              base: "master",
              body: "## Release v${{ steps.bump.outputs.new }}\n\nAutomated release branch created by `Bump Version` workflow.\n\n| | Version |\n|---|---|\n| Before | `${{ steps.bump.outputs.old }}` |\n| After | `${{ steps.bump.outputs.new }}` |\n| Type | ${{ inputs.bump_type }} |\n| Source | `${{ inputs.branch || 'develop' }}` |\n\n> **Important:** merge this PR using a **merge commit** (not squash or rebase) so that the release.yml sync-develop job can correctly align branch histories."
            });
            core.summary.addRaw(`### Release PR created\n\n[${pr.title}](${pr.html_url})\n\n**Next step:** merge using a merge commit (not rebase) once CI passes — the release pipeline will fire automatically.`);
            await core.summary.write();

      - name: Write summary
        run: |
          echo "### Version Bump" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Before | \`${{ steps.bump.outputs.old }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| After  | \`${{ steps.bump.outputs.new }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Type   | ${{ inputs.bump_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Source | ${{ inputs.branch || 'develop' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release branch | \`${{ steps.bump.outputs.pr_branch }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| PR target | \`master\` |" >> $GITHUB_STEP_SUMMARY
