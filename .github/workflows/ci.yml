# ──────────────────────────────────────────────────────────────────────────────
# CI Pipeline — AI Adoption Metrics Report
# ──────────────────────────────────────────────────────────────────────────────
#
# STAGES:
#   smoke-tests       → cross-layer @pytest.mark.smoke (~1-2 min) — opt-in via ENABLE_SMOKE
#   sanity-tests     → cross-layer "smoke or sanity" (~5-10 min) — opt-in via ENABLE_SANITY
#   unit-tests        → pure functions, no I/O
#   component-tests   → filesystem / HTTP, no cross-module orchestration
#   integration-tests → full pipeline with mocked I/O (needs Jira secrets)
#   e2e-tests         → Playwright browser + live server (needs Jira secrets)
#   windows-tests     → Windows-only socket error path (runs on windows-latest)
#   security-scan     → pip-audit vulnerability check on production deps
#
# HOW TO ENABLE A STAGE:
#   Automatic (push / PR):  GitHub → Settings → Variables → Actions
#                           Set variable to the string  true
#       ENABLE_SMOKE             smoke-tests
#       ENABLE_SANITY            sanity-tests
#       ENABLE_UNIT              unit-tests
#       ENABLE_COMPONENT         component-tests
#       ENABLE_INTEGRATION       integration-tests
#       ENABLE_E2E               e2e-tests
#       ENABLE_WINDOWS_TESTS     windows-tests
#       ENABLE_SECURITY_SCAN     security-scan
#
#   Manual one-off run:     Actions tab → "CI" → "Run workflow"
#                           Toggle the corresponding boolean input.
#
# RESTRICT TO MASTER / DEVELOP ONLY:
#   GitHub → Settings → Variables → Actions
#   Set  RESTRICT_TO_MASTER = true
#   All automatic (push/PR) runs on branches other than master and develop will be skipped.
#   workflow_dispatch (manual) runs are never restricted by this flag.
#
# JIRA SECRETS (required by integration + e2e stages):
#   GitHub → Settings → Secrets → Actions
#       JIRA_URL          https://your-org.atlassian.net
#       JIRA_EMAIL        your@email.com
#       JIRA_API_TOKEN    <Atlassian API token>
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: ["master", "develop"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Run Smoke Tests (cross-layer, ~1-2 min)"
        type: boolean
        default: true
      run_sanity:
        description: "Run Sanity Tests (smoke + sanity, ~5-10 min)"
        type: boolean
        default: false
      run_unit:
        description: "Run Unit Tests"
        type: boolean
        default: false
      run_component:
        description: "Run Component Tests"
        type: boolean
        default: false
      run_integration:
        description: "Run Integration Tests (requires Jira secrets)"
        type: boolean
        default: false
      run_e2e:
        description: "Run E2E Tests — Playwright + live server (requires Jira secrets)"
        type: boolean
        default: false
      run_windows:
        description: "Run Windows-specific Tests (windows-latest runner)"
        type: boolean
        default: false
      run_security:
        description: "Run Security Scan — pip-audit"
        type: boolean
        default: false

# Cancel superseded runs on the same branch to save runner minutes.
# event_name prefix prevents push and pull_request runs on the same branch
# (both resolve to the same branch name) from cancelling each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

# ── Shared condition fragments (referenced in each job's `if:`) ───────────────
# A job runs when EITHER:
#   a) Triggered manually (workflow_dispatch) AND the matching input is true, OR
#   b) Triggered automatically (push/PR) AND:
#        - the matching ENABLE_* repo variable is set to 'true', AND
#        - RESTRICT_TO_MASTER is not 'true', OR we are on master or develop.
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff>=0.9.0
      - name: Check style
        run: ruff check app/ tests/
      - name: Check formatting
        run: ruff format --check app/ tests/

  # ── Smoke Tests (opt-in, cross-layer) ──────────────────────────────────────
  # Runs the curated `@pytest.mark.smoke` set across all layers (~1-2 min).
  # Gated by ENABLE_SMOKE repo variable (or workflow_dispatch input).
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_smoke) ||
      (github.event_name == 'pull_request' &&
       vars.ENABLE_SMOKE == 'true' &&
       (vars.RESTRICT_TO_MASTER != 'true' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'push' &&
       vars.ENABLE_SMOKE == 'true' &&
       (vars.RESTRICT_TO_MASTER != 'true' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'))
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Cache Playwright browser binary
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements-dev.txt') }}

      - name: Install Playwright system dependencies
        run: playwright install-deps chromium

      - name: Install Playwright browser binary
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Run smoke tests
        run: >-
          pytest tests/
          -m "smoke and not windows_only"
          -n auto --dist=loadscope
          --tb=short
          --junitxml=results/smoke.xml
          --alluredir=generated/allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-smoke-${{ github.run_id }}
          path: generated/allure-results/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results
          path: results/smoke.xml

  # ── Sanity Tests (opt-in, broader cross-layer) ──────────────────────────────
  # Runs `smoke or sanity` set across all layers (~5-10 min).
  # Gated by ENABLE_SANITY repo variable (or workflow_dispatch input).
  sanity-tests:
    name: Sanity Tests
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_sanity) ||
      (github.event_name == 'pull_request' &&
       vars.ENABLE_SANITY == 'true' &&
       (vars.RESTRICT_TO_MASTER != 'true' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'push' &&
       vars.ENABLE_SANITY == 'true' &&
       (vars.RESTRICT_TO_MASTER != 'true' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'))
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Cache Playwright browser binary
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements-dev.txt') }}

      - name: Install Playwright system dependencies
        run: playwright install-deps chromium

      - name: Install Playwright browser binary
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Run sanity tests
        run: >-
          pytest tests/
          -m "(smoke or sanity) and not windows_only"
          -n auto --dist=loadscope
          --tb=short
          --junitxml=results/sanity.xml
          --alluredir=generated/allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-sanity-${{ github.run_id }}
          path: generated/allure-results/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sanity-results
          path: results/sanity.xml

  # ── Unit Tests ──────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_unit) ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       vars.ENABLE_UNIT == 'true' &&
       (vars.RESTRICT_TO_MASTER != 'true' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'))
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        run: >-
          pytest tests/unit/
          -m "unit and not windows_only"
          --tb=short
          --junitxml=results/unit.xml
          --alluredir=generated/allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-unit-${{ github.run_id }}
          path: generated/allure-results/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-results
          path: results/unit.xml

  # ── Component Tests ─────────────────────────────────────────────────────────
  component-tests:
    name: Component Tests
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_component) ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       vars.ENABLE_COMPONENT == 'true' &&
       (vars.RESTRICT_TO_MASTER != 'true' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'))
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run component tests
        run: >-
          pytest tests/component/
          -m "component and not windows_only"
          --tb=short
          --junitxml=results/component.xml
          --alluredir=generated/allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-component-${{ github.run_id }}
          path: generated/allure-results/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: component-results
          path: results/component.xml

  # ── Integration Tests ────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_integration) ||
      (github.event_name == 'pull_request' &&
       vars.ENABLE_INTEGRATION == 'true' &&
       (vars.RESTRICT_TO_MASTER != 'true' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'push' &&
       vars.ENABLE_INTEGRATION == 'true' &&
       (vars.RESTRICT_TO_MASTER != 'true' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'))
    env:
      JIRA_URL: ${{ secrets.JIRA_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run integration tests
        run: >-
          pytest tests/integration/
          -m "integration and not windows_only"
          --tb=short
          --junitxml=results/integration.xml
          --alluredir=generated/allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-integration-${{ github.run_id }}
          path: generated/allure-results/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results
          path: results/integration.xml

  # ── E2E Tests ────────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_e2e) ||
      (github.event_name == 'pull_request' &&
       vars.ENABLE_E2E == 'true' &&
       (vars.RESTRICT_TO_MASTER != 'true' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'push' &&
       vars.ENABLE_E2E == 'true' &&
       (vars.RESTRICT_TO_MASTER != 'true' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'))
    env:
      JIRA_URL: ${{ secrets.JIRA_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Cache the Playwright browser binary (~120 MB) keyed to requirements-dev.txt.
      # System-level dependencies (apt packages) are always installed because they
      # are not cached and are required even on a cache hit.
      - name: Cache Playwright browser binary
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements-dev.txt') }}

      - name: Install Playwright system dependencies
        run: playwright install-deps chromium

      - name: Install Playwright browser binary
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Run E2E tests
        run: >-
          pytest tests/e2e/
          -m "e2e and not windows_only"
          --tb=short
          --junitxml=results/e2e.xml
          --alluredir=generated/allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-e2e-${{ github.run_id }}
          path: generated/allure-results/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: results/e2e.xml

  # ── Windows-specific Tests ───────────────────────────────────────────────────
  # Runs ONLY the tests decorated with @pytest.mark.windows_only.
  # These cover OS-specific socket error behaviour (ConnectionAbortedError /
  # WSAECONNABORTED) that cannot be observed on Linux/macOS.
  windows-tests:
    name: Windows-specific Tests
    runs-on: windows-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_windows) ||
      (github.event_name == 'pull_request' &&
       vars.ENABLE_WINDOWS_TESTS == 'true' &&
       (vars.RESTRICT_TO_MASTER != 'true' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'push' &&
       vars.ENABLE_WINDOWS_TESTS == 'true' &&
       (vars.RESTRICT_TO_MASTER != 'true' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'))
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Windows-specific tests
        run: >-
          pytest tests/
          -m windows_only
          --tb=short
          --junitxml=results/windows.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-results
          path: results/windows.xml

  # ── Security Scan ────────────────────────────────────────────────────────────
  # Audits production dependencies for known CVEs using pip-audit.
  # Only scans requirements.txt (not dev deps) to minimise noise.
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_security) ||
      (github.event_name == 'pull_request' &&
       vars.ENABLE_SECURITY_SCAN == 'true' &&
       (vars.RESTRICT_TO_MASTER != 'true' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'push' &&
       vars.ENABLE_SECURITY_SCAN == 'true' &&
       (vars.RESTRICT_TO_MASTER != 'true' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'))
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit production dependencies
        run: pip-audit -r requirements.txt

  # ── Allure Report ─────────────────────────────────────────────────────────────
  # Merges per-layer allure-results artifacts, generates an HTML report with
  # trend history, and deploys it to the gh-pages branch (GitHub Pages).
  # Skipped entirely when all four test jobs were skipped (nothing to report).
  allure-report:
    name: Allure Report (GitHub Pages)
    runs-on: ubuntu-latest
    needs: [smoke-tests, sanity-tests, unit-tests, component-tests, integration-tests, e2e-tests]
    if: >
      always() &&
      (
        needs.smoke-tests.result       != 'skipped' ||
        needs.sanity-tests.result      != 'skipped' ||
        needs.unit-tests.result        != 'skipped' ||
        needs.component-tests.result   != 'skipped' ||
        needs.integration-tests.result != 'skipped' ||
        needs.e2e-tests.result         != 'skipped'
      )
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all Allure results artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*-${{ github.run_id }}
          merge-multiple: true
          path: allure-results/

      - name: Generate Allure report with history
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: allure-results
          allure_report: allure-report
          gh_pages: gh-pages
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

  # ── CI Summary ───────────────────────────────────────────────────────────────
  # Always runs; writes a markdown summary to the Actions job page.
  # Fails the workflow if any job that actually ran returned 'failure'.
  # Skipped jobs do not count as failures.
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - lint
      - smoke-tests
      - sanity-tests
      - unit-tests
      - component-tests
      - integration-tests
      - e2e-tests
      - windows-tests
      - security-scan
      - allure-report
    if: always()
    steps:
      - name: Write job summary
        run: |
          echo "## CI Results — ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Sanity Tests | ${{ needs.sanity-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Component Tests | ${{ needs.component-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows Tests | ${{ needs.windows-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Allure Report | ${{ needs.allure-report.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any enabled job failed
        if: contains(needs.*.result, 'failure')
        run: |
          echo "One or more CI stages failed. See the table above." >&2
          exit 1
