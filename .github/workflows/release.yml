# ──────────────────────────────────────────────────────────────────────────────
# Release Pipeline — AI Adoption Metrics Report
# ──────────────────────────────────────────────────────────────────────────────
#
# Git Flow: feature/* → develop → release/vX.Y.Z → [merge commit] → master
#
# TRIGGER: Any push to master (i.e. when a release/vX.Y.Z PR is merged).
#   The `check` job reads the version from pyproject.toml and skips all
#   downstream jobs if a tag for that version already exists — making the
#   pipeline idempotent (hotfix commits without a version bump are safe).
#
# STAGES:
#   check          → detect new version; gate for all downstream jobs
#   validate       → lint + unit + component tests
#   build          → create the release ZIP
#   release        → create GitHub Release and attach ZIP
#   sync-develop   → merge master back into develop to realign branch histories
#
# TO TRIGGER A RELEASE:
#   1. Run bump-version.yml (workflow_dispatch) — it cuts a release/vX.Y.Z branch
#      from develop, bumps the version, and opens a PR to master automatically.
#   2. Let CI validate the release branch (runs automatically on all branches).
#   3. Merge the PR to master using a MERGE COMMIT (not squash or rebase).
#   4. This workflow fires automatically: tags, builds, publishes the release,
#      then merges master back into develop to sync the version bump.
# ──────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    branches: ["master"]

permissions:
  contents: write   # required to create GitHub Releases and tags

env:
  PYTHON_VERSION: "3.12"

jobs:

  # ── Check: is this a new version? ────────────────────────────────────────────
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      should_release: ${{ steps.read.outputs.should_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # need full tag history

      - name: Read version and check if tag exists
        id: read
        run: |
          VERSION=$(grep -Po '(?<=^version = ")[^"]+' pyproject.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${VERSION} already exists — skipping release."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "New version v${VERSION} detected — proceeding with release."
          fi

  # ── Gate: Lint + Unit + Component ────────────────────────────────────────────
  validate:
    name: Validate (lint + unit + component)
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint — ruff check
        run: ruff check app/ tests/

      - name: Lint — ruff format
        run: ruff format --check app/ tests/

      - name: Unit tests
        run: pytest tests/ -m "unit and not windows_only" --tb=short -q

      - name: Component tests
        run: pytest tests/ -m "component and not windows_only" --tb=short -q

  # ── Build release ZIP ─────────────────────────────────────────────────────────
  build:
    name: Build ZIP
    runs-on: ubuntu-latest
    needs: [check, validate]
    if: needs.check.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Build release ZIP
        run: |
          VERSION=${{ needs.check.outputs.version }}
          ZIP_NAME=ai_adoption_manager_v${VERSION}
          STAGING="generated/releases/${ZIP_NAME}"
          mkdir -p "$STAGING"

          rsync -a --exclude='__pycache__' --exclude='*.pyc' --exclude='*.pyo' \
            --exclude='.pytest_cache' --exclude='.mypy_cache' --exclude='.ruff_cache' \
            --exclude='*.log' --exclude='dau_report.json' \
            app/ "$STAGING/app/"
          rsync -a ui/ "$STAGING/ui/"
          rsync -a config/ "$STAGING/config/"

          mkdir -p "$STAGING/tools"
          cp tools/fetch_ssl_cert.py "$STAGING/tools/"

          for f in main.py server.py requirements.txt pyproject.toml start_app.bat project_setup.bat README.md; do
            cp "$f" "$STAGING/"
          done
          cp .env.example "$STAGING/"

          # Ensure Windows batch scripts have CRLF line endings in the ZIP.
          # .gitattributes enforces this on checkout, but this explicit step
          # guards against edge cases (forks, old checkouts, CI image changes).
          # sed 's/\r\{0,1\}$/\r/' normalises both LF-only and already-CRLF lines to CRLF.
          find "$STAGING" -name "*.bat" -exec sed -i 's/\r\{0,1\}$/\r/' {} +

          (cd "generated/releases/${ZIP_NAME}" && zip -r "../${ZIP_NAME}.zip" .)
          rm -rf "generated/releases/${ZIP_NAME}/"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-zip
          path: generated/releases/*.zip

  # ── Publish GitHub Release ────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check, build]
    if: needs.check.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.check.outputs.version }}"
          name: "Release v${{ needs.check.outputs.version }}"
          generate_release_notes: true
          files: dist/*.zip

  # ── Sync master back to develop ───────────────────────────────────────────────
  # bump-version.yml cuts a release/vX.Y.Z branch from develop and merges it
  # into master (merge commit). This means develop never receives the version
  # bump directly. This job merges master back into develop immediately after
  # every release, bringing the version bump into develop via a proper merge
  # commit and keeping branch histories aligned for future releases.
  sync-develop:
    name: Sync master → develop
    runs-on: ubuntu-latest
    needs: [check, release]
    if: needs.check.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge master into develop
        run: |
          git fetch origin master
          git merge origin/master \
            -m "chore: sync develop with master after v${{ needs.check.outputs.version }} release [skip ci]"
          git push origin develop