# ──────────────────────────────────────────────────────────────────────────────
# Release Pipeline — AI Adoption Metrics Report
# ──────────────────────────────────────────────────────────────────────────────
#
# Triggered by pushing a version tag: git tag v1.2.3 && git push origin v1.2.3
#
# STAGES:
#   validate   → lint + unit + component tests (gate before publishing)
#   build      → create the release ZIP using create_app_zip.bat logic
#   release    → create GitHub Release and upload ZIP as asset
#
# PREREQUISITES:
#   - pyproject.toml [project] version must match the pushed tag (e.g. v1.2.3)
#   - Tag must be pushed to the master branch (enforce via GitHub tag protection)
# ──────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write   # required to create GitHub Releases

env:
  PYTHON_VERSION: "3.12"

jobs:

  # ── Gate: Lint + Unit + Component ────────────────────────────────────────────
  validate:
    name: Validate (lint + unit + component)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint — ruff check
        run: ruff check app/ tests/

      - name: Lint — ruff format
        run: ruff format --check app/ tests/

      - name: Unit tests
        run: pytest tests/ -m "unit and not windows_only" --tb=short -q

      - name: Component tests
        run: pytest tests/ -m "component and not windows_only" --tb=short -q

  # ── Build release ZIP ─────────────────────────────────────────────────────────
  build:
    name: Build ZIP
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      zip_name: ${{ steps.get_version.outputs.zip_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(python -c "import re; m=re.search(r'version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()); print(m.group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip_name=ai_adoption_manager_v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches pyproject.toml version
        run: |
          TAG="${{ github.ref_name }}"          # e.g. v1.2.3
          EXPECTED="v${{ steps.get_version.outputs.version }}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "ERROR: Tag '$TAG' does not match pyproject.toml version '$EXPECTED'"
            exit 1
          fi

      - name: Build release ZIP
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          ZIP_NAME=${{ steps.get_version.outputs.zip_name }}
          STAGING="generated/releases/${ZIP_NAME}"
          mkdir -p "$STAGING"

          # Copy application sources
          rsync -a --exclude='__pycache__' --exclude='*.pyc' --exclude='*.pyo' \
            --exclude='.pytest_cache' --exclude='.mypy_cache' --exclude='.ruff_cache' \
            --exclude='*.log' --exclude='dau_report.json' \
            app/ "$STAGING/app/"
          rsync -a templates/ "$STAGING/templates/"
          rsync -a ui/ "$STAGING/ui/"
          rsync -a config/ "$STAGING/config/"
          rsync -a data/ "$STAGING/data/"

          mkdir -p "$STAGING/tools"
          cp tools/fetch_ssl_cert.py "$STAGING/tools/"

          mkdir -p "$STAGING/docs/product/schemas"

          mkdir -p "$STAGING/certs"
          echo "Place jira_ca_bundle.pem here if your Jira instance uses a custom CA." \
            > "$STAGING/certs/README.txt"

          # Copy root files
          for f in main.py server.py requirements.txt start_app.bat project_setup.bat README.md; do
            cp "$f" "$STAGING/"
          done
          # .env.example needs explicit copy (leading dot may be missed by shell globs)
          cp .env.example "$STAGING/"

          cd generated/releases
          zip -r "${ZIP_NAME}.zip" "${ZIP_NAME}/"
          rm -rf "${ZIP_NAME}/"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-zip
          path: generated/releases/*.zip

  # ── Publish GitHub Release ────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/*.zip
