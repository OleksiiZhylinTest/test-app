# ──────────────────────────────────────────────────────────────────────────────
# Release Pipeline — AI Adoption Metrics Report
# ──────────────────────────────────────────────────────────────────────────────
#
# Git Flow: feature/* → develop → [PR rebase] → master → Release
#
# TRIGGER: Any push to master (including PR merge from develop).
#   The `check` job reads the version from pyproject.toml and skips all
#   downstream jobs if a tag for that version already exists — making the
#   pipeline idempotent (hotfix commits without a version bump are safe).
#
# STAGES:
#   check      → detect new version; gate for all downstream jobs
#   validate   → lint + unit + component tests
#   build      → create the release ZIP
#   release    → create GitHub Release and attach ZIP
#
# TO TRIGGER A RELEASE:
#   1. Run bump-version.yml (workflow_dispatch) on develop to set the new version
#   2. Merge develop → master via PR (rebase merge)
#   3. This workflow fires automatically; creates tag v{version} and GitHub Release
# ──────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    branches: ["master"]

permissions:
  contents: write   # required to create GitHub Releases and tags

env:
  PYTHON_VERSION: "3.12"

jobs:

  # ── Check: is this a new version? ────────────────────────────────────────────
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      should_release: ${{ steps.read.outputs.should_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # need full tag history

      - name: Read version and check if tag exists
        id: read
        run: |
          VERSION=$(grep -Po '(?<=^version = ")[^"]+' pyproject.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${VERSION} already exists — skipping release."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "New version v${VERSION} detected — proceeding with release."
          fi

  # ── Gate: Lint + Unit + Component ────────────────────────────────────────────
  validate:
    name: Validate (lint + unit + component)
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint — ruff check
        run: ruff check app/ tests/

      - name: Lint — ruff format
        run: ruff format --check app/ tests/

      - name: Unit tests
        run: pytest tests/ -m "unit and not windows_only" --tb=short -q

      - name: Component tests
        run: pytest tests/ -m "component and not windows_only" --tb=short -q

  # ── Build release ZIP ─────────────────────────────────────────────────────────
  build:
    name: Build ZIP
    runs-on: ubuntu-latest
    needs: [check, validate]
    if: needs.check.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Build release ZIP
        run: |
          VERSION=${{ needs.check.outputs.version }}
          ZIP_NAME=ai_adoption_manager_v${VERSION}
          STAGING="generated/releases/${ZIP_NAME}"
          mkdir -p "$STAGING"

          rsync -a --exclude='__pycache__' --exclude='*.pyc' --exclude='*.pyo' \
            --exclude='.pytest_cache' --exclude='.mypy_cache' --exclude='.ruff_cache' \
            --exclude='*.log' --exclude='dau_report.json' \
            app/ "$STAGING/app/"
          rsync -a templates/ "$STAGING/templates/"
          rsync -a ui/ "$STAGING/ui/"
          rsync -a config/ "$STAGING/config/"
          rsync -a data/ "$STAGING/data/"

          mkdir -p "$STAGING/tools"
          cp tools/fetch_ssl_cert.py "$STAGING/tools/"
          mkdir -p "$STAGING/certs"
          echo "Place jira_ca_bundle.pem here if your Jira instance uses a custom CA." \
            > "$STAGING/certs/README.txt"

          for f in main.py server.py requirements.txt start_app.bat project_setup.bat README.md; do
            cp "$f" "$STAGING/"
          done
          cp .env.example "$STAGING/"

          cd generated/releases
          zip -r "${ZIP_NAME}.zip" "${ZIP_NAME}/"
          rm -rf "${ZIP_NAME}/"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-zip
          path: generated/releases/*.zip

  # ── Publish GitHub Release ────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check, build]
    if: needs.check.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.check.outputs.version }}"
          name: "Release v${{ needs.check.outputs.version }}"
          generate_release_notes: true
          files: dist/*.zip