[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
cache_dir = "generated/.pytest_cache"
markers = [
    "unit: pure-function tests with no I/O (deselect with -m 'not unit')",
    "component: tests that exercise filesystem or HTTP but no inter-module orchestration (deselect with -m 'not component')",
    "integration: tests requiring module integration (skip with -m 'not integration')",
    "e2e: end-to-end tests (skip with -m 'not e2e')",
    "windows_only: tests covering Windows-specific OS behaviour (automatically skipped on Linux/macOS via skipif decorator)",
    "smoke: critical happy-path tests across all layers (~1-2 min total). Select with -m smoke",
    "sanity: broader regression set across all layers (~5-10 min total). Select smoke+sanity with -m 'smoke or sanity'",
]

[tool.playwright]
browser = "chromium"
timeout = 5000

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-adoption-manager"
version = "1.1.2"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["app"]

[tool.ruff]
line-length = 120
target-version = "py310"
cache-dir = "generated/.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]  # pycodestyle, pyflakes, isort, pyupgrade

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
cache_dir = "generated/.mypy_cache"

[[tool.mypy.overrides]]
module = ["app.server._base", "app.server.cert_handlers", "app.server.config_handlers", "app.server.connection_handlers", "app.server.filter_handlers", "app.server.generate_handlers", "app.server.schema_handlers", "app.server.dau_handlers"]
disable_error_code = ["attr-defined"]
