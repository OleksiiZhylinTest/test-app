# nexus.yaml — Consumer manifest for nexus-agentic-sdlc
# Generated by `nexus setup` on first run; updated by `nexus update`.
# Edit this file to configure agents, features, and paths for this project.
# DO NOT edit nexus.defaults.yaml — override only the keys you need here.

# ─────────────────────────────────────────────────────────────
# Framework — tracks which version of nexus-agentic-sdlc this
# repo was set up with and where to fetch updates from.
# ─────────────────────────────────────────────────────────────
framework:
  version: "1.0.0"
  source: "https://github.com/OleksiiZhylinTest/nexus-agentic-sdlc"

# ─────────────────────────────────────────────────────────────
# Project — wizard answers describing this specific repo.
# Used to populate templates and conditionally enable features.
# ─────────────────────────────────────────────────────────────
project:
  name: "test-app"
  description: "Local Python tool that fetches Jira sprint data and generates HTML/Markdown reports"
  tech_stack: ["python"]
  project_type: "web_app"   # web_app | cli_tool | library | data_pipeline | microservice
  team_size: "small"          # solo | small (2-5) | medium (6-15) | large (16+)
  ci_platform: "github_actions"      # github_actions | gitlab_ci | jenkins | circle_ci | none
  test_framework: "pytest" # pytest | unittest | nose2 | none
  package_manager: "uv" # pip | uv

# ─────────────────────────────────────────────────────────────
# Tools — which AI assistants are active in this repo.
# Disabling a tool suppresses its agent roster and namespace files.
# ─────────────────────────────────────────────────────────────
tools:
  claude:
    enabled: true
  copilot:
    enabled: true
  cursor:
    enabled: false
  gemini:
    enabled: false

# ─────────────────────────────────────────────────────────────
# Agents — toggle individual agents on/off.
# Disabled agents are excluded from CLAUDE.md roster and
# agent-index.md summaries. Project-manager cannot be disabled.
# ─────────────────────────────────────────────────────────────
agents:
  project_manager: true
  product_owner: true
  dev_lead: true
  developer: true
  business_analyst: true
  solution_architect: true
  principal_solution_architect: true
  test_lead: true
  test_engineer: true
  devops_lead: true
  devops_engineer: true
  ai_architect: true
  ai_engineer: true
  web_search: true

# ─────────────────────────────────────────────────────────────
# Features — granular capability toggles.
# Each section maps to a framework behavior. Disable a section
# to suppress its generated files and CLAUDE.md guidance.
# ─────────────────────────────────────────────────────────────
features:

  # Spec-Driven Development — slash-command speckit workflow
  speckit:
    enabled: true
    require_clarify_step: true
    require_plan_approval: true
    require_chain_approval: true
    auto_git_commit: false

  # SDD Tracks — which change-type tracks are active
  sdd_tracks:
    track_0_ai_ecosystem: true
    track_1_product_feature: true
    track_2_tests: true
    track_3_cicd: true

  # Maker-Checker — two-agent review loop for all leaf-agent work
  maker_checker:
    enabled: true

  # Hooks — Claude Code PreToolUse / PostToolUse hooks
  hooks:
    post_edit_lint: true
    post_stop_notify: true
    pre_bash_safety: true
    pre_edit_boundary: true

  # Telemetry — session stats and reporting
  telemetry:
    claude_session_stats: true
    copilot_session_stats: false
    report_on_session_end: true

  # Audit — ecosystem and code quality audit capabilities
  audit:
    ai_ecosystem:
      enabled: true
      schedule: "on_demand"   # on_demand | weekly | monthly
    context:
      enabled: true
    complexity:
      enabled: false
    security:
      enabled: false
    continuous_improvement:
      enabled: false
      auto_submit: false
      framework_repo: "https://github.com/OleksiiZhylinTest/nexus-agentic-sdlc"

  # Quality gates — requirements tracking, coverage, doc sync
  quality:
    test_coverage_gate: false
    requirements_tracking: false
    doc_sync_check: false

  # CI — automated update and scheduled test workflows
  ci:
    auto_update_pr:
      enabled: false
      schedule: "0 9 * * 1"    # cron — weekly Monday 9am UTC by default
    windows_test_run:
      enabled: false
      schedule: "0 6 * * 1"  # cron — weekly Monday 6am UTC by default

  # Integrations — external service connections
  integrations:
    jira:
      enabled: false
      mcp_script: ""

# ─────────────────────────────────────────────────────────────
# Paths — where framework artifacts are written.
# All paths are relative to the repo root.
# Override only if your repo layout deviates from defaults.
# ─────────────────────────────────────────────────────────────
paths:
  generated: "generated"
  reports: "generated/reports"
  logs: "generated/logs"
  logs_hooks: "generated/logs/hooks"
  logs_sessions: "generated/logs/sessions"
  debug: "generated/debug"
  tmp: "generated/tmp"
  specs: "specs"
  constitution: ".specify/memory/constitution.md"
  summaries_claude: ".claude/summaries"
  summaries_copilot: ".github/summaries"
  coverage: "tests/coverage"
